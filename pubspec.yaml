name: melos_rack_workspace
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

workspace:
  - packages/diagnostic
  - packages/flutter_diagnostic

dev_dependencies:
  coolint: ^2.1.2
  melos: ^7.8.0

melos:
  repository:
    type: "github"
    origin: "https://github.com/coolosos/diagnostic"
    owner: "coolosos"
    name: "diagnostic"

  command:
    version:
      branch: main
      linkToCommits: true
      updateGitTagRefs: true
      workspaceChangelog: true
    bootstrap:
      runPubGetInParallel: false

  scripts:
    pub_upgrade:
      exec: flutter pub upgrade
      description: Run `flutter pub upgrade` in all packages.

    format:
      exec: dart format .
      description: Run `dart format .` in all packages.

    analyze:
      exec: dart analyze --fatal-infos .
      description: Run `dart analyze` in all packages.
      packageFilters:
        ignore:
          - "*example*"

    format_check:
      exec: dart format --set-exit-if-changed .
      description: Run `dart format --set-exit-if-changed .` in all packages.

    test:
      run: melos exec --concurrency=1 -- "flutter test"
      description: Run `flutter test` sequentially in all packages with a test folder.
      packageFilters:
        dirExists:
          - test
        ignore:
          - "*example*"
